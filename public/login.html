<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – SmartTrip</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg smart-navbar">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <i class="bi bi-compass-fill"></i> SmartTrip
      </a>
      <div>
        <a href="index.html" class="btn btn-outline-secondary btn-sm me-2">Home</a>
        <a href="register.html" class="btn btn-primary-smart btn-sm">Create Account</a>
      </div>
    </div>
  </nav>

  <!-- Login Form Container -->
  <div class="container my-auto py-5">
    <div class="row justify-content-center">
      <div class="col-md-5 col-lg-4">
        <div class="smart-card p-4 p-md-5">
          <div class="text-center mb-4">
            <div class="stat-icon primary mx-auto mb-2">
              <i class="bi bi-person-fill-lock"></i>
            </div>
            <h3 class="fw-bold">Welcome Back</h3>
            <p class="text-muted small">Log in to manage your smart travel plans</p>
          </div>

          <div id="loginAlert" class="alert alert-danger d-none" role="alert"></div>

          <form id="loginForm">
            <div class="mb-3">
              <label for="email" class="form-label small fw-bold">Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
              </div>
            </div>

            <div class="mb-3">
              <label for="password" class="form-label small fw-bold">Password</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-key"></i></span>
                <input type="password" class="form-control" id="password" placeholder="••••••••" required>
              </div>
            </div>

            <button type="submit" id="btnLoginSubmit" class="btn btn-primary-smart w-100 mb-3">
              Sign In
            </button>

            <!-- Quick Demo Login Button for Viva Demonstration -->
            <button type="button" id="btnQuickDemoLogin" class="btn btn-outline-secondary btn-sm w-100 mb-3">
              <i class="bi bi-lightning-charge-fill text-warning me-1"></i> Quick Demo Login (demo@smarttrip.com)
            </button>

            <div class="text-center small text-muted">
              Don't have an account? <a href="register.html" class="text-primary fw-bold">Register here</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script>
    $(document).ready(function () {
      // Quick Demo Fill
      $('#btnQuickDemoLogin').on('click', function () {
        $('#email').val('demo@smarttrip.com');
        $('#password').val('password123');
        $('#loginForm').submit();
      });

      $('#loginForm').on('submit', function (e) {
        e.preventDefault();
        const email = $('#email').val().trim();
        const password = $('#password').val();

        $('#btnLoginSubmit').html('<span class="spinner-border spinner-border-sm me-2"></span> Signing in...').prop('disabled', true);
        $('#loginAlert').addClass('d-none');

        $.ajax({
          url: '/api/login',
          type: 'POST',
          contentType: 'application/json',
          data: JSON.stringify({ email, password }),
          success: function (res) {
            if (res.success && res.token) {
              SmartTrip.setAuth(res.token, res.user);
              showToast('Logged in successfully!', 'success');
              setTimeout(() => {
                window.location.href = 'dashboard.html';
              }, 500);
            } else {
              $('#loginAlert').removeClass('d-none').text(res.message || 'Invalid credentials.');
              $('#btnLoginSubmit').text('Sign In').prop('disabled', false);
            }
          },
          error: function (xhr) {
            const err = xhr.responseJSON ? xhr.responseJSON.message : 'Login failed. Please verify credentials.';
            $('#loginAlert').removeClass('d-none').text(err);
            $('#btnLoginSubmit').text('Sign In').prop('disabled', false);
          }
        });
      });
    });
  </script>
</body>
</html>
