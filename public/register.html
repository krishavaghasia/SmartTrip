<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register – SmartTrip</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg smart-navbar">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <i class="bi bi-compass-fill"></i> SmartTrip
      </a>
      <div>
        <a href="index.html" class="btn btn-outline-secondary btn-sm me-2">Home</a>
        <a href="login.html" class="btn btn-outline-primary btn-sm">Sign In</a>
      </div>
    </div>
  </nav>

  <!-- Register Form Container -->
  <div class="container my-auto py-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="smart-card p-4 p-md-5">
          <div class="text-center mb-4">
            <div class="stat-icon success mx-auto mb-2">
              <i class="bi bi-person-plus-fill"></i>
            </div>
            <h3 class="fw-bold">Create Account</h3>
            <p class="text-muted small">Join SmartTrip for intelligent travel planning</p>
          </div>

          <div id="registerAlert" class="alert alert-danger d-none" role="alert"></div>

          <form id="registerForm">
            <div class="mb-3">
              <label for="name" class="form-label small fw-bold">Full Name</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                <input type="text" class="form-control" id="name" placeholder="John Doe" required>
              </div>
            </div>

            <div class="mb-3">
              <label for="email" class="form-label small fw-bold">Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
              </div>
            </div>

            <div class="mb-3">
              <label for="password" class="form-label small fw-bold">Password</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-key"></i></span>
                <input type="password" class="form-control" id="password" placeholder="At least 6 characters" minlength="6" required>
              </div>
            </div>

            <div class="mb-4">
              <label for="confirmPassword" class="form-label small fw-bold">Confirm Password</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-check2-circle"></i></span>
                <input type="password" class="form-control" id="confirmPassword" placeholder="Re-type password" required>
              </div>
            </div>

            <button type="submit" id="btnRegisterSubmit" class="btn btn-primary-smart w-100 mb-3">
              Create Account
            </button>

            <div class="text-center small text-muted">
              Already have an account? <a href="login.html" class="text-primary fw-bold">Login here</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script>
    $(document).ready(function () {
      $('#registerForm').on('submit', function (e) {
        e.preventDefault();
        const name = $('#name').val().trim();
        const email = $('#email').val().trim();
        const password = $('#password').val();
        const confirmPassword = $('#confirmPassword').val();

        if (password !== confirmPassword) {
          $('#registerAlert').removeClass('d-none').text('Passwords do not match.');
          return;
        }

        $('#btnRegisterSubmit').html('<span class="spinner-border spinner-border-sm me-2"></span> Creating Account...').prop('disabled', true);
        $('#registerAlert').addClass('d-none');

        $.ajax({
          url: '/api/register',
          type: 'POST',
          contentType: 'application/json',
          data: JSON.stringify({ name, email, password, confirmPassword }),
          success: function (res) {
            if (res.success && res.token) {
              SmartTrip.setAuth(res.token, res.user);
              showToast('Account created successfully!', 'success');
              setTimeout(() => {
                window.location.href = 'dashboard.html';
              }, 500);
            } else {
              $('#registerAlert').removeClass('d-none').text(res.message || 'Registration failed.');
              $('#btnRegisterSubmit').text('Create Account').prop('disabled', false);
            }
          },
          error: function (xhr) {
            const err = xhr.responseJSON ? xhr.responseJSON.message : 'Registration failed. Email may already be in use.';
            $('#registerAlert').removeClass('d-none').text(err);
            $('#btnRegisterSubmit').text('Create Account').prop('disabled', false);
          }
        });
      });
    });
  </script>
</body>
</html>
