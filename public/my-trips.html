<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Trips – SmartTrip</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg smart-navbar">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <i class="bi bi-compass-fill"></i> SmartTrip
      </a>
      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="mainNavbar">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="explore.html">Explore Places</a></li>
          <li class="nav-item"><a class="nav-link" href="create-trip.html">Plan Trip</a></li>
          <li class="nav-item"><a class="nav-link active" href="my-trips.html">My Trips</a></li>
          <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
        </ul>

        <ul class="navbar-nav align-items-center" id="navAuthContainer">
          <!-- Populated by main.js -->
        </ul>
      </div>
    </div>
  </nav>

  <!-- My Trips Container -->
  <div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
      <div>
        <h2 class="fw-bold mb-1">My Saved Trips</h2>
        <p class="text-muted mb-0">Browse, view, optimize, or delete your customized travel plans</p>
      </div>
      <a href="create-trip.html" class="btn btn-primary-smart">
        <i class="bi bi-plus-circle me-1"></i> Plan Another Trip
      </a>
    </div>

    <!-- Trips Grid -->
    <div class="row g-4" id="myTripsList">
      <div class="col-12 text-center py-5">
        <div class="spinner-border text-primary" role="status"></div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script>
    $(document).ready(function () {
      loadMyTrips();
    });

    function loadMyTrips() {
      const container = $('#myTripsList');
      $.get('/api/trips', function (res) {
        container.empty();
        if (res.success && res.data && res.data.length > 0) {
          res.data.forEach(trip => {
            const budgetFormatted = parseFloat(trip.budget).toLocaleString('en-IN');
            container.append(`
              <div class="col-md-6 col-lg-4">
                <div class="smart-card h-100">
                  <div style="height: 180px; position: relative; overflow: hidden;">
                    <img src="${trip.destination_image || 'https://images.unsplash.com/photo-1599831104328-5696144e59df?auto=format&fit=crop&w=600&q=80'}" class="w-100 h-100 object-fit-cover" alt="${trip.title}">
                    <span class="position-absolute top-0 end-0 m-2 badge bg-dark bg-opacity-75">
                      <i class="bi bi-calendar3 me-1"></i> ${trip.duration_days || 2} Days
                    </span>
                    <span class="position-absolute bottom-0 start-0 m-2 badge bg-primary">
                      <i class="bi bi-star-fill text-warning me-1"></i> Trip Score: ${trip.trip_score || 88}/100
                    </span>
                  </div>
                  <div class="p-3">
                    <h5 class="fw-bold mb-1">${trip.title}</h5>
                    <p class="text-muted small mb-2"><i class="bi bi-geo-alt me-1"></i>${trip.destination_name}</p>
                    
                    <div class="d-flex justify-content-between small text-secondary bg-light p-2 rounded mb-3">
                      <div><i class="bi bi-wallet2 text-success me-1"></i> ₹${budgetFormatted}</div>
                      <div><i class="bi bi-people text-primary me-1"></i> ${trip.travelers} Travelers</div>
                      <div><i class="bi bi-bus-front text-muted me-1"></i> ${trip.transport}</div>
                    </div>

                    <div class="d-flex gap-2">
                      <a href="itinerary.html?trip_id=${trip.trip_id}" class="btn btn-primary-smart btn-sm flex-grow-1 text-center">
                        <i class="bi bi-eye me-1"></i> View
                      </a>
                      <a href="itinerary.html?trip_id=${trip.trip_id}" class="btn btn-outline-secondary btn-sm" title="Edit / Optimize">
                        <i class="bi bi-sliders"></i>
                      </a>
                      <button class="btn btn-outline-danger btn-sm" title="Delete Trip" onclick="deleteUserTrip(${trip.trip_id})">
                        <i class="bi bi-trash"></i>
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            `);
          });
        } else {
          container.html(`
            <div class="col-12 text-center py-5">
              <i class="bi bi-suitcase-lg text-muted fs-1 mb-3 d-block"></i>
              <h5>No Saved Trips</h5>
              <p class="text-muted">You haven't saved any trips yet. Generate an intelligent travel plan now!</p>
              <a href="create-trip.html" class="btn btn-primary-smart mt-2">
                <i class="bi bi-plus-circle me-1"></i> Plan a Trip
              </a>
            </div>
          `);
        }
      }).fail(function () {
        container.html('<div class="col-12 text-center py-5 text-muted">Failed to load trips.</div>');
      });
    }

    function deleteUserTrip(tripId) {
      if (!confirm('Are you sure you want to delete this trip itinerary?')) return;

      $.ajax({
        url: `/api/trips/${tripId}`,
        type: 'DELETE',
        success: function (res) {
          if (res.success) {
            showToast('Trip deleted successfully.', 'info');
            loadMyTrips();
          }
        },
        error: function () {
          showToast('Failed to delete trip.', 'danger');
        }
      });
    }
  </script>
</body>
</html>
